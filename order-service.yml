server:
  port: 9091
order:
  message: Hello Order service from centralized config
app:
  environment: DEFAULT
  rest:
    connect-timeout: 2000
    read-timeout: 3000
resilience4j:
  retry:
    instances:
      userService:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.lang.Exception
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - org.springframework.web.client.HttpClientErrorException
       #  - java.lang.RuntimeException
        ignore-exceptions:
          - com.project.task.exception.ResourceNotFoundException
          - com.project.task.exception.BadRequestException
  circuitbreaker:
    instances:
      userService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.project.task.exception.ResourceNotFoundException
          - com.project.task.exception.BadRequestException
  bulkhead:
    instances:
      userService:
        max-concurrent-calls: 5
        max-wait-duration: 0s
  thread-pool-bulkhead:
    instances:
      userService:
        max-thread-pool-size: 5
        core-thread-pool-size: 3
        queue-capacity: 10

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    root: INFO
    com.project.task: DEBUG
    io.github.resilience4j.retry: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG
    io.github.resilience4j.timelimiter: DEBUG
    org.springframework.web.client: DEBUG

    
